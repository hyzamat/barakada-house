name: Deploy site to GitHub Pages

# Publishes the site/ folder to the gh-pages branch on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp asset versions
        # Fresh CSS/JS URLs on every deploy, so browsers never mix a new page with cached old files.
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/index.html

      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: barakadahouse.hizarc.com
          # One commit only, so old copies of the media don't pile up in the repo.
          force_orphan: true
          exclude_assets: '.github,server.mjs'
          commit_message: Deploy ${{ github.sha }}
