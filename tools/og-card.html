<!doctype html>
<!-- Link-preview card (1200x630). Render with: tools/build_og.ps1 -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,280,100,1&family=Manrope:wght@600;700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #080605; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(55% 60% at 50% 40%, rgba(120, 52, 20, .32), transparent 70%),
      radial-gradient(80% 50% at 50% 100%, rgba(228, 91, 44, .28), transparent 70%),
      #080605;
    font-family: Manrope, sans-serif;
  }
  .badge {
    position: absolute; left: 50%; top: 46px; translate: -50% 0;
    display: flex; align-items: center; gap: 14px;
    padding: 11px 26px 11px 20px; border-radius: 999px;
    border: 1px solid rgba(242, 205, 126, .28);
    background: rgba(243, 234, 219, .04);
    color: rgba(243, 234, 219, .72);
    font-size: 15px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase;
    white-space: nowrap;
  }
  .badge i { width: 9px; height: 9px; border-radius: 50%; background: #e45b2c; box-shadow: 0 0 12px #e45b2c; }
  h1 {
    position: absolute; left: 0; right: 0; top: 96px; margin: 0;
    text-align: center; white-space: nowrap;
    font: italic 280 150px/1 Fraunces, serif;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
    letter-spacing: -.045em;
    color: #f3eadb;
    text-shadow: 0 10px 50px rgba(0, 0, 0, .55);
  }
  h1 em { font-style: italic; color: #f2cd7e; }
  .lede {
    position: absolute; left: 0; right: 0; top: 268px; margin: 0; text-align: center;
    font-size: 24px; font-weight: 600; color: rgba(243, 234, 219, .7);
  }
  .lede b { color: #f3eadb; font-weight: 600; border-bottom: 2px solid #e45b2c; }
  .stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 0; }
  .fire {
    position: absolute; left: 110px; right: 110px; top: 338px; height: 420px;
    border-radius: 30px; overflow: hidden;
    transform: rotateX(14deg); transform-origin: 50% 0;
    box-shadow: 0 -30px 120px -20px rgba(228, 91, 44, .6), 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .fire img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; filter: saturate(1.1) contrast(1.08) brightness(.9); }
  .fire::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8, 6, 5, .35), transparent 30%, transparent 60%, rgba(8, 6, 5, .6)); }
</style>
</head>
<body>
  <div class="card">
    <div class="stage"><div class="fire"><img src="../site/media/film/l-012.webp" alt=""></div></div>
    <div class="badge"><i></i>Made for the whole barkada</div>
    <h1>Barkada <em>House</em></h1>
    <p class="lede">Feasts made for sharing. <b>Charcoal-grilled</b> in Riyadh.</p>
  </div>
</body>
</html>
